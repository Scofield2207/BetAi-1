services:
  - type: web
    name: betai-frontend
    env: static
    buildCommand: "npm run build"
    staticPublishPath: "dist"
  - type: web
    name: betai-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install && npm run build || true"
    startCommand: "cd backend && npm start"
    envVars:
      - key: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE_KEY
      - key: ADMIN_KEY
